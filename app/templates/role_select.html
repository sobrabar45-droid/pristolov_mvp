<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выбор роли</title>
</head>
<body>
    <h1>Выбор роли</h1>

    <p><strong>Игрок:</strong> {{ player.nickname }}</p>
    <p><strong>Игра:</strong> {{ game.title }}</p>
    <p><strong>Дом:</strong> {{ house.name }}</p>

    <form method="post" action="/player/{{ player.id }}/role-select">
        <div style="margin-bottom: 12px;">
            <label for="role_id">Выберите роль:</label>
            <select id="role_id" name="role_id" required>
                {% for role in roles %}
                    <option value="{{ role.id }}">
                        {{ role.name }}{% if role.description %} — {{ role.description }}{% endif %}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Подтвердить роль</button>
    </form>

    {% if error %}
        <p style="color: red; margin-top: 16px;">{{ error }}</p>
    {% endif %}
</body>
</html>
