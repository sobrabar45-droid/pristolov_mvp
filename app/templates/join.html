<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в игру приСтолов</title>
  <style>
    :root {
      --bg: #100d0a;
      --card: rgba(24, 17, 12, 0.84);
      --gold: #d9a441;
      --gold-soft: #f3d389;
      --ink: #f7ead4;
      --muted: #cdb58f;
      --line: rgba(243, 211, 137, 0.26);
      --danger: #ffb4a8;
      --shadow: rgba(0, 0, 0, 0.52);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(10, 7, 5, 0.94) 0%, rgba(10, 7, 5, 0.82) 48%, rgba(10, 7, 5, 0.58) 100%),
        linear-gradient(0deg, rgba(10, 7, 5, 0.96) 0%, rgba(10, 7, 5, 0.22) 55%, rgba(10, 7, 5, 0.74) 100%),
        url('/static/homepage/hero_council_room.png');
      background-position: center;
      background-size: cover;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
      overflow-x: hidden;
    }

    .page {
      display: grid;
      min-height: 100vh;
      padding: 28px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      width: min(1060px, 100%);
      margin: 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50% 50% 46% 46%;
      background:
        linear-gradient(145deg, rgba(243, 211, 137, 0.30), rgba(169, 66, 36, 0.18)),
        radial-gradient(circle at 50% 35%, var(--gold), transparent 45%);
      box-shadow: 0 12px 30px var(--shadow), inset 0 0 18px rgba(255,255,255,0.10);
    }

    .home-link {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      color: var(--gold-soft);
      background: rgba(10, 7, 5, 0.42);
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    main {
      display: grid;
      align-items: center;
      width: min(1060px, 100%);
      margin: 0 auto;
      padding: 52px 0;
    }

    .entry-card {
      width: min(560px, 100%);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 34px;
      background:
        radial-gradient(circle at 80% 10%, rgba(217, 164, 65, 0.16), transparent 18rem),
        var(--card);
      box-shadow: 0 28px 80px rgba(0,0,0,0.48);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      display: inline-flex;
      margin-bottom: 16px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--gold-soft);
      background: rgba(8, 5, 4, 0.42);
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      color: var(--ink);
      font-size: clamp(38px, 8vw, 62px);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .helper {
      margin: 0 0 26px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 17px;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      color: var(--gold-soft);
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 0 16px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.07);
      font-family: Arial, sans-serif;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold-soft);
      box-shadow: 0 0 0 4px rgba(217, 164, 65, 0.14);
    }

    input::placeholder { color: rgba(247, 234, 212, 0.50); }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      color: #1b1109;
      background: linear-gradient(135deg, var(--gold-soft), var(--gold));
      box-shadow: 0 18px 44px rgba(217, 164, 65, 0.24);
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .error {
      margin: 18px 0 0;
      border: 1px solid rgba(255, 180, 168, 0.36);
      border-radius: 16px;
      padding: 12px 14px;
      color: var(--danger);
      background: rgba(110, 26, 18, 0.22);
      font-family: Arial, sans-serif;
    }

    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      body {
        background:
          linear-gradient(90deg, rgba(10, 7, 5, 0.96) 0%, rgba(10, 7, 5, 0.86) 100%),
          linear-gradient(0deg, rgba(10, 7, 5, 0.98) 0%, rgba(10, 7, 5, 0.24) 50%, rgba(10, 7, 5, 0.78) 100%),
          url('/static/homepage/hero_council_room.png');
        background-position: 62% center;
        background-size: cover;
      }

      .page { padding: 18px; }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      main { padding: 36px 0; }

      .entry-card {
        padding: 22px;
        border-radius: 26px;
      }

      .helper { font-size: 16px; }

      button,
      input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar" aria-label="Верхняя навигация">
      <a class="brand" href="/" aria-label="приСтолов">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>приСтолов</span>
      </a>
      <a class="home-link" href="/">На главную</a>
    </header>

    <main>
      <section class="entry-card" aria-labelledby="join-title">
        <div class="eyebrow">Вход для игроков</div>
        <h1 id="join-title">Вход в игру приСтолов</h1>
        <p class="helper">Введите код комнаты от ведущего. Если у вас QR-код или ссылка, используйте их.</p>

        <form method="post" action="/join">
          <label for="room_code">Код комнаты</label>
          <input type="text" id="room_code" name="room_code" placeholder="Например: IRON01" required autocomplete="off" inputmode="text">
          <button type="submit">Войти</button>
        </form>

        {% if error %}
          <p class="error">{{ error }}</p>
        {% endif %}

        <p class="note">Код комнаты выдаёт ведущий на событии.</p>
      </section>
    </main>
  </div>
</body>
</html>
