    label: "Тихая поддержка"
    phase_or_context: last_whisper
    route_or_source: "POST /player/last-whisper/action/{player_id}"
    mutates_state: true
    smoke_covered: true
    smoke_script: scripts/smoke_last_whisper_quiet_support.py
